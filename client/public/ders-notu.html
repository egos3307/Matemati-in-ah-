<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ders Notu Oluştur – Fullematematiği</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <!-- html2canvas: sayfayı canvas'a çevirir -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- jsPDF: canvas'ları PDF'e ekler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sari: #F5C518;
      --panel: #111827;
      --panel2: #1f2937;
      --panel3: #374151;
      --muted: #9ca3af;
      --a4w: 210mm;
    }

    body {
      font-family: 'Lexend', sans-serif;
      background: #1a1a2e;
      color: #f9fafb;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Üst bar ── */
    .top-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--panel3);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .top-bar img { height: 30px; width: 30px; border-radius: 50%; object-fit: contain; }
    .top-bar h1 { font-size: 14px; font-weight: 900; }
    .top-bar span { font-size: 11px; color: var(--muted); }

    /* ── Çalışma alanı ── */
    .workspace { display: flex; flex: 1; overflow: hidden; }

    /* ════════════════════════════
       SOL PANEL
    ════════════════════════════ */
    .left-panel {
      width: 300px;
      min-width: 260px;
      background: var(--panel);
      border-right: 1px solid var(--panel3);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .lbl {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); margin-bottom: 3px;
    }

    .fg { display: flex; flex-direction: column; gap: 4px; }
    .fg input, .fg select {
      background: var(--panel2); border: 1px solid var(--panel3);
      border-radius: 8px; color: #e5e7eb; font-size: 12px;
      padding: 7px 10px; outline: none; font-family: 'Lexend', sans-serif;
      transition: border-color .2s;
    }
    .fg input:focus, .fg select:focus { border-color: var(--sari); }
    .fg select option { background: var(--panel2); }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    textarea#html-input {
      flex: 1; min-height: 260px;
      background: var(--panel2); border: 1px solid var(--panel3);
      border-radius: 10px; color: #e5e7eb;
      font-family: 'Courier New', monospace; font-size: 11.5px; line-height: 1.55;
      padding: 10px; resize: vertical; outline: none; transition: border-color .2s;
    }
    textarea#html-input:focus { border-color: var(--sari); }
    textarea#html-input::placeholder { color: #4b5563; }

    .divider { height: 1px; background: var(--panel3); }

    .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    .tpl-btn {
      background: var(--panel2); border: 1px solid var(--panel3);
      border-radius: 7px; color: #9ca3af; font-size: 10px; font-weight: 600;
      padding: 6px 7px; cursor: pointer; text-align: center;
      transition: all .15s; font-family: 'Lexend', sans-serif;
    }
    .tpl-btn:hover { border-color: var(--sari); color: var(--sari); }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 13px; border: none; border-radius: 9px;
      font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all .18s; width: 100%;
    }
    .btn-photo {
      background: var(--panel2); border: 1.5px solid var(--panel3); color: #d1d5db;
    }
    .btn-photo:hover { border-color: var(--sari); color: var(--sari); }
    .btn-pdf {
      background: var(--sari); color: #111;
      box-shadow: 0 4px 12px rgba(245,197,24,.3);
    }
    .btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(245,197,24,.4); }
    .btn-pdf:disabled { opacity: .6; pointer-events: none; }
    .btn-clear {
      background: transparent; border: 1px solid var(--panel3);
      color: var(--muted); font-size: 11px;
    }
    .btn-clear:hover { border-color: #6b7280; }

    #foto-input { display: none; }

    /* ════════════════════════════
       SAĞ PANEL – Önizleme
    ════════════════════════════ */
    .right-panel {
      flex: 1; background: #d1d5db;
      overflow-y: auto; display: flex; flex-direction: column;
      align-items: center; padding: 20px 20px 40px;
    }

    .preview-bar {
      width: 100%; max-width: var(--a4w);
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .preview-bar span { font-size: 11px; color: #6b7280; font-weight: 600; }
    .sayfa-badge {
      background: #b0b6bf; border-radius: 20px; padding: 3px 11px;
      font-size: 10px; font-weight: 700; color: #374151;
    }

    /* ── Sayfalar Konteyneri ── */
    #sayfalar-konteyner {
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      width: 100%;
    }

    /* ── Her A4 Sayfası ── */
    .a4-sayfa {
      width: var(--a4w);
      background: #fff;
      box-shadow: 0 4px 28px rgba(0,0,0,.18);
      border-radius: 2px;
      display: flex; flex-direction: column;
      font-family: 'Lexend', sans-serif;
      color: #1a1a1a;
      position: relative;
      min-height: 297mm;
    }

    /* HEADER */
    .sayfa-header { padding: 7mm 10mm 0; flex-shrink: 0; }
    .header-ust { display: flex; align-items: center; gap: 10px; padding-bottom: 5px; }
    .logo-daire {
      width: 50px; height: 50px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0; border: 2px solid var(--sari);
    }
    .logo-daire img { width: 100%; height: 100%; object-fit: contain; }
    .header-metin { flex: 1; }
    .header-marka { font-size: 20px; font-weight: 900; line-height: 1.1; letter-spacing: -.5px; }
    .header-altyazi { font-size: 8.5px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
    .header-meta { text-align: right; flex-shrink: 0; }
    .meta-row { font-size: 9px; font-weight: 600; color: #374151; line-height: 1.8; }
    .meta-row strong { color: #111; }
    .sari-serit { height: 5px; background: linear-gradient(90deg, var(--sari), #f0b800); margin-top: 6px; border-radius: 2px; }

    /* KONU BARI */
    .konu-bar {
      padding: 4px 10mm; background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .konu-bar-lbl { font-size: 9px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .07em; flex-shrink: 0; }
    .konu-text { font-size: 10.5px; font-weight: 700; color: #111; flex: 1; }
    .sinif-rozet { font-size: 9px; font-weight: 700; color: var(--sari); background: #1a1a1a; padding: 1px 7px; border-radius: 20px; flex-shrink: 0; }

    /* İÇERİK ALANI */
    .sayfa-icerik {
      padding: 5mm 10mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9mm 14mm;
      align-content: start;
      outline: none;
    }
    .sayfa-icerik:focus { box-shadow: inset 0 0 0 2px rgba(245,197,24,.25); }

    /* Soru kutuları */
    .sayfa-icerik .soru,
    .sayfa-icerik .soru-kutusu {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .sayfa-icerik img { max-width: 100%; height: auto; display: block; margin: 4px 0; border-radius: 4px; }
    .sayfa-icerik p, .sayfa-icerik div:not([class]) {
      font-size: 11px; line-height: 1.6; color: #1a1a1a;
    }

    /* Boş durum */
    .bos-gosterge {
      grid-column: 1 / -1; text-align: center;
      padding: 18mm 0; color: #d1d5db;
      font-size: 11px; font-weight: 600;
      pointer-events: none; user-select: none;
    }
    .bos-gosterge svg { display: block; margin: 0 auto 10px; opacity: .4; }

    /* Sayfa numarasını işaretleyen etiket */
    .sayfa-no-etiket {
      position: absolute; top: -14px; right: 0;
      font-size: 10px; font-weight: 700; color: #6b7280;
    }

    /* FOOTER */
    .sayfa-footer { padding: 0 10mm 5mm; flex-shrink: 0; margin-top: auto; }
    .footer-serit { height: 4px; background: linear-gradient(90deg, var(--sari), #f0b800); border-radius: 2px; margin-bottom: 5px; }
    .footer-ic { display: flex; justify-content: space-between; align-items: center; }
    .footer-marka { font-size: 8.5px; font-weight: 700; color: #6b7280; }
    .footer-marka strong { color: #374151; }
    .footer-sayfa { font-size: 8.5px; font-weight: 600; color: #9ca3af; }

    /* PDF üretimi için gizlenecek */
    .sayfa-no-etiket { print-color-adjust: exact; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #111827; border: 1px solid #374151; color: #f9fafb;
      padding: 9px 15px; border-radius: 9px; font-size: 12px; font-weight: 600;
      z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,.3);
      transition: opacity .3s, transform .3s;
    }
    .toast.hide { opacity: 0; transform: translateY(8px); }
    .toast.ok  { border-left: 3px solid #22c55e; }
    .toast.inf { border-left: 3px solid var(--sari); }
    .toast.err { border-left: 3px solid #ef4444; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
  </style>
</head>
<body>

<!-- ÜST BAR -->
<div class="top-bar">
  <img src="/logo.png" alt="Logo" onerror="this.style.display='none'" />
  <h1>Ders Notu Oluştur</h1>
  <span>— Fullematematiği Öğretmen Araçları</span>
</div>

<div class="workspace">

  <!-- ══ SOL PANEL ══ -->
  <aside class="left-panel">

    <div class="fg">
      <p class="lbl">Konu / Başlık</p>
      <input id="inp-konu" type="text" placeholder="Ör: Üçgenler – 8. Sınıf" oninput="metaGuncelle()" />
    </div>

    <div class="row2">
      <div class="fg">
        <p class="lbl">Sınıf</p>
        <select id="inp-sinif" onchange="metaGuncelle()">
          <option value="">—</option>
          <option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option>
          <option>8. Sınıf</option><option>9. Sınıf</option><option>10. Sınıf</option>
          <option>11. Sınıf</option><option>12. Sınıf</option>
          <option>LGS</option><option>YKS</option><option>KPSS</option>
        </select>
      </div>
      <div class="fg">
        <p class="lbl">Tarih</p>
        <input id="inp-tarih" type="date" oninput="metaGuncelle()" />
      </div>
    </div>

    <div class="divider"></div>

    <p class="lbl">Hızlı Şablon</p>
    <div class="tpl-grid">
      <button class="tpl-btn" onclick="sablonEkle('sorular')">2 Sütun Sorular</button>
      <button class="tpl-btn" onclick="sablonEkle('tek')">Tek Sütun</button>
      <button class="tpl-btn" onclick="sablonEkle('bosluk')">Boşluk Doldur</button>
      <button class="tpl-btn" onclick="sablonEkle('konu')">Konu Anlatım</button>
    </div>

    <div class="divider"></div>

    <p class="lbl">HTML İçerik</p>
    <textarea id="html-input" rows="14"
      placeholder="HTML yapıştırın...&#10;&#10;Sayfa geçişi için:&#10;&lt;div style=&quot;grid-column:span 2;page-break-after:always&quot;&gt;&lt;/div&gt;"
      oninput="icerikGuncelle()"
    ></textarea>

    <div class="divider"></div>

    <input type="file" id="foto-input" accept="image/*" onchange="fotografYukle(event)" />
    <button class="btn btn-photo" onclick="document.getElementById('foto-input').click()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Seçili Yere Fotoğraf Ekle
    </button>

    <button class="btn btn-pdf" id="btn-pdf" onclick="pdfUret()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      PDF Üret
    </button>

    <button class="btn btn-clear" onclick="temizle()">Alanı Temizle</button>

  </aside>

  <!-- ══ SAĞ PANEL ══ -->
  <section class="right-panel">
    <div class="preview-bar">
      <span>Canlı Önizleme</span>
      <span class="sayfa-badge" id="sayfa-badge">A4 • 1 Sayfa</span>
    </div>
    <div id="sayfalar-konteyner"></div>
  </section>

</div><!-- /workspace -->

<script>
/* ══════════════════════════════════════════════
   YARDIMCI: Meta bilgileri oku
══════════════════════════════════════════════ */
function getMeta() {
  const tarih = document.getElementById('inp-tarih').value;
  return {
    konu:  document.getElementById('inp-konu').value.trim(),
    sinif: document.getElementById('inp-sinif').value,
    tarih: tarih
      ? new Date(tarih + 'T00:00:00').toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' })
      : '—'
  };
}

/* ══════════════════════════════════════════════
   A4 SAYFA HTML OLUŞTUR
   Her sayfa: header + konu barı + icerik grid + footer
══════════════════════════════════════════════ */
function sayfaHTML(icerikHTML, sayfaNo, toplamSayfa) {
  const { konu, sinif, tarih } = getMeta();
  const bos = !icerikHTML.trim();

  return `
  <div class="a4-sayfa" data-no="${sayfaNo}">
    ${toplamSayfa > 1 ? `<div class="sayfa-no-etiket">Sayfa ${sayfaNo} / ${toplamSayfa}</div>` : ''}

    <header class="sayfa-header">
      <div class="header-ust">
        <div class="logo-daire">
          <img src="/logo.png" alt="" onerror="this.parentElement.style.background='#F5C518';this.style.display='none'" />
        </div>
        <div class="header-metin">
          <div class="header-marka">Fullematematiği</div>
          <div class="header-altyazi">Online Matematik Özel Dersi</div>
        </div>
        <div class="header-meta">
          <div class="meta-row"><strong>${sinif || '—'}</strong></div>
          <div class="meta-row">${tarih}</div>
        </div>
      </div>
      <div class="sari-serit"></div>
    </header>

    <div class="konu-bar">
      <span class="konu-bar-lbl">Konu:</span>
      <span class="konu-text">${konu || '—'}</span>
      ${sinif ? `<span class="sinif-rozet">${sinif}</span>` : ''}
    </div>

    <div class="sayfa-icerik" contenteditable="true" spellcheck="false">
      ${bos ? `
        <div class="bos-gosterge">
          <svg width="38" height="38" fill="none" stroke="#9ca3af" stroke-width="1.5" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          Sol panelden HTML yapıştırın veya şablon seçin.
        </div>` : icerikHTML}
    </div>

    <footer class="sayfa-footer">
      <div class="footer-serit"></div>
      <div class="footer-ic">
        <div class="footer-marka"><strong>Burak Çelik</strong> / Fullematematiği</div>
        <div class="footer-sayfa">${toplamSayfa > 1 ? `${sayfaNo} / ${toplamSayfa} • ` : ''}fullematematigi.com.tr</div>
      </div>
    </footer>
  </div>`;
}

/* ══════════════════════════════════════════════
   EXPLICIT SAYFA KESİMLERİNDE BÖLL
   page-break-after:always veya break-after:always içeren div'lerde böler
══════════════════════════════════════════════ */
function splitAtBreaks(htmlKod) {
  const temp = document.createElement('div');
  temp.innerHTML = htmlKod;

  const gruplar = [[]];
  for (const child of temp.children) {
    const s = (child.getAttribute('style') || '').replace(/\s/g, '');
    const isBreak = s.includes('page-break-after:always') || s.includes('break-after:always') || s.includes('break-after:page');
    if (isBreak) {
      gruplar.push([]);
    } else {
      gruplar[gruplar.length - 1].push(child.cloneNode(true));
    }
  }
  return gruplar.filter(g => g.length > 0);
}

/* ══════════════════════════════════════════════
   İÇERİK ALANI MAKSİMUM YÜKSEKLİĞİ (px) - Bir kez ölç
   min-height:297mm sayesinde footer gerçek konumda olur.
══════════════════════════════════════════════ */
let cachedMaxH = null;

async function getMaxH() {
  if (cachedMaxH) return cachedMaxH;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:0;left:-99999px;visibility:hidden;pointer-events:none;';
  wrap.innerHTML = sayfaHTML('<div style="height:1px;opacity:0;"></div>', 1, 1);
  document.body.appendChild(wrap);

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  const icerik = wrap.querySelector('.sayfa-icerik');
  const footer = wrap.querySelector('.sayfa-footer');
  const measured = footer.getBoundingClientRect().top - icerik.getBoundingClientRect().top - 12;

  document.body.removeChild(wrap);

  /* Güvenlik: ölçüm makul değil ise (100px'den az) A4 oranından hesapla */
  if (measured < 100) {
    const a4w = document.querySelector('.a4-sayfa')?.offsetWidth || 794;
    cachedMaxH = Math.round(220 * a4w / 210); /* 220mm içerik yüksekliği tahmini */
  } else {
    cachedMaxH = measured;
  }
  return cachedMaxH;
}

/* ══════════════════════════════════════════════
   OTOMATİK OVERFLOW BÖLME
   Tüm elementleri tek bir gizli grid'e koy, offsetTop ile hangi sayfaya
   düştüğünü hesapla. position:relative kritik — offsetTop bunu referans alır.
══════════════════════════════════════════════ */
async function autoSplit(elements, maxHeightPx) {
  if (elements.length === 0) return [[]];
  if (elements.length === 1) return [[elements[0].outerHTML]];

  const a4w    = document.querySelector('.a4-sayfa')?.offsetWidth || 794;
  const pad    = Math.round(a4w * 10 / 210);
  const gapCol = Math.round(a4w * 14 / 210);
  const gapRow = Math.round(a4w *  9 / 210);

  /* Gizli ölçüm grid'i — position:relative zorunlu, aksi hâlde
     offsetTop window'a göre ölçülür ve tutarsız sonuç verir */
  const grid = document.createElement('div');
  grid.style.cssText = [
    'position:relative',
    `width:${a4w - pad * 2}px`,
    'display:grid',
    'grid-template-columns:1fr 1fr',
    `column-gap:${gapCol}px`,
    `row-gap:${gapRow}px`,
    'align-content:start',
    "font-family:'Lexend',sans-serif",
    'font-size:11px',
    'box-sizing:border-box'
  ].join(';');

  const offscreen = document.createElement('div');
  offscreen.style.cssText = 'position:fixed;top:0;left:-99999px;visibility:hidden;pointer-events:none;';
  offscreen.appendChild(grid);
  document.body.appendChild(offscreen);

  /* Klonları grid'e ekle */
  const klonlar = elements.map(el => {
    const k = el.cloneNode(true);
    grid.appendChild(k);
    return k;
  });

  /* İki frame render bekle (grid layout tam oturması için) */
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  await new Promise(r => requestAnimationFrame(r));

  /* Her klon için offsetTop (grid içi konum) */
  const sayfalar = [[]];
  let pageStart = 0; /* mevcut sayfanın grid-top başlangıcı */

  for (let i = 0; i < klonlar.length; i++) {
    const elTop = klonlar[i].offsetTop;

    /* Elemanın ÜSTÜ sayfanın limitini geçtiyse yeni sayfa aç.
       elTop bazlı kontrol: üstü sığan eleman sayfada kalır,
       diğer türlü footer yakınında gereksiz boşluk oluşur. */
    if (sayfalar[sayfalar.length - 1].length > 0 &&
        (elTop - pageStart) >= maxHeightPx) {
      pageStart = elTop;
      sayfalar.push([]);
    }

    sayfalar[sayfalar.length - 1].push(elements[i].outerHTML);
  }

  document.body.removeChild(offscreen);
  return sayfalar;
}

/* ══════════════════════════════════════════════
   ANA RENDER FONKSİYONU
══════════════════════════════════════════════ */
let renderTimer = null;

function icerikGuncelle() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(yenidenRenderle, 180);
}

async function yenidenRenderle() {
  const htmlKod = document.getElementById('html-input').value.trim();
  const konteyner = document.getElementById('sayfalar-konteyner');

  /* Boş ise tek sayfa placeholder */
  if (!htmlKod) {
    konteyner.innerHTML = sayfaHTML('', 1, 1);
    document.getElementById('sayfa-badge').textContent = 'A4 • 1 Sayfa';
    bindContentEditable();
    return;
  }

  /* 1. Explicit page-break'lerde böl */
  const gruplar = splitAtBreaks(htmlKod);

  /* 2. İçerik yüksekliği limitini al */
  const maxH = await getMaxH();

  /* 3. Her grup için overflow kontrolü yap */
  const tumSayfaIcerikleri = [];
  for (const grup of gruplar) {
    const subPages = await autoSplit(grup, maxH);
    for (const sp of subPages) {
      tumSayfaIcerikleri.push(sp.join(''));
    }
  }

  /* 4. HTML oluştur ve render et */
  const toplam = tumSayfaIcerikleri.length;
  konteyner.innerHTML = tumSayfaIcerikleri
    .map((ic, i) => sayfaHTML(ic, i + 1, toplam))
    .join('');

  document.getElementById('sayfa-badge').textContent =
    `A4 • 210mm • ${toplam} Sayfa`;

  /* 5. KaTeX */
  if (typeof renderMathInElement === 'function') {
    try {
      renderMathInElement(konteyner, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$',  right: '$',  display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    } catch(e) {}
  }

  bindContentEditable();
}

/* ══════════════════════════════════════════════
   CONTENTEDITABLE SYNC
   Sağ taraftaki herhangi bir sayfayı düzenleyince textarea güncelle
══════════════════════════════════════════════ */
function bindContentEditable() {
  document.querySelectorAll('.sayfa-icerik').forEach(el => {
    el.addEventListener('input', () => {
      const tumIcerik = Array.from(document.querySelectorAll('.sayfa-icerik'))
        .map(e => e.innerHTML)
        .filter(h => !h.includes('bos-gosterge'))
        .join('\n');
      document.getElementById('html-input').value = tumIcerik;
    });
  });
}

/* ══════════════════════════════════════════════
   META BİLGİ GÜNCELLEME
   Konu/sınıf/tarih değişince tüm sayfaların header'ını güncelle
══════════════════════════════════════════════ */
function metaGuncelle() {
  const { konu, sinif, tarih } = getMeta();

  document.querySelectorAll('.a4-sayfa').forEach(sayfa => {
    const km = sayfa.querySelector('.header-marka');
    if (!km) return; /* henüz render olmamış */

    sayfa.querySelector('.konu-text').textContent = konu || '—';

    const mrows = sayfa.querySelectorAll('.meta-row');
    if (mrows[0]) mrows[0].innerHTML = `<strong>${sinif || '—'}</strong>`;
    if (mrows[1]) mrows[1].textContent = tarih;

    const rozet = sayfa.querySelector('.sinif-rozet');
    if (sinif) {
      if (rozet) { rozet.textContent = sinif; rozet.style.display = ''; }
      else {
        const kb = sayfa.querySelector('.konu-bar');
        if (kb) {
          const r = document.createElement('span');
          r.className = 'sinif-rozet';
          r.textContent = sinif;
          kb.appendChild(r);
        }
      }
    } else {
      if (rozet) rozet.style.display = 'none';
    }
  });
}

/* ══════════════════════════════════════════════
   FOTOĞRAF EKLEME
══════════════════════════════════════════════ */
function fotografYukle(e) {
  const dosya = e.target.files[0];
  if (!dosya) return;

  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.createElement('img');
    img.src = ev.target.result;
    img.style.cssText = 'max-width:100%;height:auto;display:block;margin:5px 0;border-radius:4px;';

    /* Aktif contenteditable içine imleç yerine ekle */
    const sel = window.getSelection();
    let eklendi = false;

    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      const icerikAlanlari = document.querySelectorAll('.sayfa-icerik');
      for (const alan of icerikAlanlari) {
        if (alan.contains(range.commonAncestorContainer)) {
          range.deleteContents();
          range.insertNode(img);
          range.collapse(false);
          toast('Fotoğraf eklendi.', 'ok');
          eklendi = true;
          break;
        }
      }
    }

    if (!eklendi) {
      /* İmleç yoksa son sayfanın sonuna ekle */
      const alanlar = document.querySelectorAll('.sayfa-icerik');
      const son = alanlar[alanlar.length - 1];
      if (son) { son.appendChild(img); toast('Fotoğraf son sayfaya eklendi.', 'inf'); }
    }

    /* Textarea senkronize et */
    const tumIcerik = Array.from(document.querySelectorAll('.sayfa-icerik'))
      .map(e => e.innerHTML).filter(h => !h.includes('bos-gosterge')).join('\n');
    document.getElementById('html-input').value = tumIcerik;
  };
  reader.readAsDataURL(dosya);
  e.target.value = '';
}

/* ══════════════════════════════════════════════
   PDF ÜRETME
   Strateji: zaten ekranda görünen her .a4-sayfa elementini
   html2canvas ile tek tek yakala → jsPDF ile birleştir.
   Klon veya off-screen element YOK — doğrudan ekrandaki DOM.
══════════════════════════════════════════════ */
async function pdfUret() {
  const btn = document.getElementById('btn-pdf');
  btn.disabled = true;
  btn.textContent = 'Hazırlanıyor...';

  const sayfaListesi = Array.from(document.querySelectorAll('.a4-sayfa'));
  if (!sayfaListesi.length) {
    btn.disabled = false;
    btn.textContent = 'PDF Üret';
    return;
  }

  /* Overlay */
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(17,24,39,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Lexend,sans-serif;';
  overlay.innerHTML = `
    <div id="pdf-spinner" style="width:44px;height:44px;border:4px solid #F5C518;border-top-color:transparent;border-radius:50%;animation:_spin .8s linear infinite;"></div>
    <div id="pdf-durum" style="color:#fff;font-weight:700;font-size:14px;">Hazırlanıyor…</div>
    <style>@keyframes _spin{to{transform:rotate(360deg)}}</style>`;
  document.body.appendChild(overlay);
  const durum = overlay.querySelector('#pdf-durum');

  /* Geçici: gölge ve köşe kaldır, sayfa no etiketlerini gizle */
  sayfaListesi.forEach(s => {
    s.dataset.os  = s.style.boxShadow;
    s.dataset.or  = s.style.borderRadius;
    s.style.boxShadow    = 'none';
    s.style.borderRadius = '0';
  });
  document.querySelectorAll('.sayfa-no-etiket').forEach(e => e.style.visibility = 'hidden');

  await new Promise(r => requestAnimationFrame(r));

  const dosyaAdi = (document.getElementById('inp-konu').value || 'ders-notu')
    .toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '') || 'ders-notu';

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });

    for (let i = 0; i < sayfaListesi.length; i++) {
      durum.textContent = `Sayfa ${i + 1} / ${sayfaListesi.length} işleniyor…`;

      /* Her sayfayı viewport'a kaydır ki html2canvas görsün */
      sayfaListesi[i].scrollIntoView({ block: 'start' });
      await new Promise(r => setTimeout(r, 80));

      const canvas = await html2canvas(sayfaListesi[i], {
        scale: 2,
        useCORS: true,
        allowTaint: false,
        logging: false,
        backgroundColor: '#ffffff'
      });

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      /* A4: 210mm genişlik, yükseklik orana göre */
      const pdfW = 210;
      const pdfH = (canvas.height * pdfW) / canvas.width;

      if (i > 0) pdf.addPage([210, Math.max(297, pdfH)], 'portrait');
      pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
    }

    pdf.save(`${dosyaAdi}.pdf`);
    toast('PDF indirildi!', 'ok');

  } catch (err) {
    console.error('PDF hatası:', err);
    toast('PDF hatası: ' + err.message, 'err');
  } finally {
    /* Stilleri geri yükle */
    sayfaListesi.forEach(s => {
      s.style.boxShadow    = s.dataset.os || '';
      s.style.borderRadius = s.dataset.or || '';
    });
    document.querySelectorAll('.sayfa-no-etiket').forEach(e => e.style.visibility = '');
    document.body.removeChild(overlay);
    btn.disabled = false;
    btn.innerHTML = `
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      PDF Üret`;
  }
}

  yenidenRenderle();
  toast('Alan temizlendi.', 'inf');
}

/* ══════════════════════════════════════════════
   TOAST
══════════════════════════════════════════════ */
function toast(msg, tip = 'inf') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = `toast ${tip}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 350); }, 2500);
}
