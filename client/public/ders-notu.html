<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ders Notu Oluştur – Fullematematiği</title>

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

  <!-- PDF.js (Mozilla) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module" id="pdfjs-script"></script>

  <!-- html2canvas + jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700;900&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sari: #F5C518;
      --turuncu: #e67e22;
      --panel: #111827;
      --panel2: #1f2937;
      --panel3: #374151;
      --muted: #9ca3af;
      --a4w: 210mm;
      --accent: #3b82f6;
      --green: #22c55e;
    }

    body {
      font-family: 'Lexend', sans-serif;
      background: #1a1a2e;
      color: #f9fafb;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Üst bar ── */
    .top-bar {
      background: var(--panel);
      border-bottom: 1px solid var(--panel3);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .top-bar img { height: 30px; width: 30px; border-radius: 50%; object-fit: contain; }
    .top-bar h1 { font-size: 14px; font-weight: 900; }
    .top-bar span { font-size: 11px; color: var(--muted); }
    .top-bar .ai-badge {
      margin-left: auto;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      letter-spacing: .05em;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .ai-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.5;transform:scale(.85)}
    }

    /* ── Çalışma alanı ── */
    .workspace { display: flex; flex: 1; overflow: hidden; }

    /* ════════════════════════════
       SOL PANEL
    ════════════════════════════ */
    .left-panel {
      width: 320px;
      min-width: 280px;
      background: var(--panel);
      border-right: 1px solid var(--panel3);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .lbl {
      font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--muted); margin-bottom: 3px;
    }

    .fg { display: flex; flex-direction: column; gap: 4px; }
    .fg input, .fg select {
      background: var(--panel2); border: 1px solid var(--panel3);
      border-radius: 8px; color: #e5e7eb; font-size: 12px;
      padding: 7px 10px; outline: none; font-family: 'Lexend', sans-serif;
      transition: border-color .2s;
    }
    .fg input:focus, .fg select:focus { border-color: var(--sari); }
    .fg select option { background: var(--panel2); }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

    .divider { height: 1px; background: var(--panel3); }

    /* ── Giriş seçenekleri ── */
    .input-section-title {
      font-size: 11px;
      font-weight: 700;
      color: #e5e7eb;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .input-section-title .badge {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--turuncu);
      color: #fff;
    }

    /* PDF yükleme alanı */
    .pdf-drop-zone {
      border: 2px dashed var(--turuncu);
      border-radius: 10px;
      padding: 14px 10px;
      text-align: center;
      cursor: pointer;
      transition: all .2s;
      background: rgba(230,126,34,.06);
      position: relative;
    }
    .pdf-drop-zone:hover, .pdf-drop-zone.dragover {
      border-color: #f39c12;
      background: rgba(230,126,34,.14);
    }
    .pdf-drop-zone input {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .pdf-drop-zone .drop-icon {
      font-size: 22px;
      margin-bottom: 5px;
    }
    .pdf-drop-zone .drop-text {
      font-size: 11px;
      font-weight: 600;
      color: var(--turuncu);
    }
    .pdf-drop-zone .drop-sub {
      font-size: 9.5px;
      color: var(--muted);
      margin-top: 2px;
    }
    #pdf-dosya-adi {
      font-size: 10px;
      color: var(--green);
      font-weight: 700;
      text-align: center;
      min-height: 14px;
      margin-top: 3px;
    }

    /* Metin alanı */
    textarea#hoca-metin-girdisi {
      width: 100%;
      height: 160px;
      background: var(--panel2);
      border: 1px solid var(--panel3);
      border-radius: 10px;
      color: #e5e7eb;
      font-family: 'Lexend', sans-serif;
      font-size: 11.5px;
      line-height: 1.55;
      padding: 10px;
      resize: vertical;
      outline: none;
      transition: border-color .2s;
    }
    textarea#hoca-metin-girdisi:focus { border-color: var(--accent); }
    textarea#hoca-metin-girdisi::placeholder { color: #4b5563; }

    /* ── AI Durum Paneli ── */
    .ai-panel {
      background: rgba(99,102,241,.08);
      border: 1px solid rgba(99,102,241,.25);
      border-radius: 10px;
      padding: 11px 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    .ai-panel.active { display: flex; }

    #ai-durum-yazisi {
      font-size: 11px;
      font-weight: 600;
      color: #a5b4fc;
      min-height: 16px;
    }

    .progress-bar-wrap {
      background: var(--panel3);
      border-radius: 20px;
      height: 8px;
      overflow: hidden;
    }
    #ai-progress-bar {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #a78bfa);
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
      transition: width .4s ease;
      width: 0%;
    }
    @keyframes shimmer {
      0%{background-position:200% 0}
      100%{background-position:-200% 0}
    }

    .ai-parca-info {
      font-size: 9.5px;
      color: var(--muted);
      text-align: right;
    }

    /* ── Butonlar ── */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 13px; border: none; border-radius: 9px;
      font-family: 'Lexend', sans-serif; font-size: 12px; font-weight: 700;
      cursor: pointer; transition: all .18s; width: 100%;
    }
    .btn-ai {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 12px rgba(99,102,241,.35);
    }
    .btn-ai:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,.45); }
    .btn-ai:disabled { opacity: .55; pointer-events: none; }
    .btn-photo {
      background: var(--panel2); border: 1.5px solid var(--panel3); color: #d1d5db;
    }
    .btn-photo:hover { border-color: var(--sari); color: var(--sari); }
    .btn-pdf {
      background: var(--sari); color: #111;
      box-shadow: 0 4px 12px rgba(245,197,24,.3);
    }
    .btn-pdf:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(245,197,24,.4); }
    .btn-pdf:disabled { opacity: .6; pointer-events: none; }
    .btn-clear {
      background: transparent; border: 1px solid var(--panel3);
      color: var(--muted); font-size: 11px;
    }
    .btn-clear:hover { border-color: #6b7280; }

    #foto-input { display: none; }

    /* Model bilgi etiketi */
    .model-info {
      font-size: 9.5px;
      color: var(--muted);
      text-align: center;
      padding: 4px 8px;
      background: var(--panel2);
      border-radius: 6px;
      border: 1px solid var(--panel3);
    }
    .model-info strong { color: #a78bfa; }

    /* ════════════════════════════
       SAĞ PANEL – Önizleme
    ════════════════════════════ */
    .right-panel {
      flex: 1; background: #d1d5db;
      overflow-y: auto; display: flex; flex-direction: column;
      align-items: center; padding: 20px 20px 40px;
    }

    .preview-bar {
      width: 100%; max-width: var(--a4w);
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px;
    }
    .preview-bar span { font-size: 11px; color: #6b7280; font-weight: 600; }
    .sayfa-badge {
      background: #b0b6bf; border-radius: 20px; padding: 3px 11px;
      font-size: 10px; font-weight: 700; color: #374151;
    }

    /* ── Sayfalar Konteyneri ── */
    #sayfalar-konteyner {
      display: flex; flex-direction: column;
      align-items: center; gap: 20px;
      width: 100%;
    }

    /* ── Her A4 Sayfası ── */
    .a4-sayfa {
      width: var(--a4w);
      background: #fff;
      box-shadow: 0 4px 28px rgba(0,0,0,.18);
      border-radius: 2px;
      display: flex; flex-direction: column;
      font-family: 'Lexend', sans-serif;
      color: #1a1a1a;
      position: relative;
      min-height: 297mm;
    }

    /* HEADER */
    .sayfa-header { padding: 7mm 10mm 0; flex-shrink: 0; }
    .header-ust { display: flex; align-items: center; gap: 10px; padding-bottom: 5px; }
    .logo-daire {
      width: 50px; height: 50px; border-radius: 50%;
      overflow: hidden; flex-shrink: 0; border: 2px solid var(--sari);
    }
    .logo-daire img { width: 100%; height: 100%; object-fit: contain; }
    .header-metin { flex: 1; }
    .header-marka { font-size: 20px; font-weight: 900; line-height: 1.1; letter-spacing: -.5px; }
    .header-altyazi { font-size: 8.5px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .12em; margin-top: 2px; }
    .header-meta { text-align: right; flex-shrink: 0; }
    .meta-row { font-size: 9px; font-weight: 600; color: #374151; line-height: 1.8; }
    .meta-row strong { color: #111; }
    .sari-serit { height: 5px; background: linear-gradient(90deg, var(--sari), #f0b800); margin-top: 6px; border-radius: 2px; }

    /* KONU BARI */
    .konu-bar {
      padding: 4px 10mm; background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .konu-bar-lbl { font-size: 9px; font-weight: 700; color: #9ca3af; text-transform: uppercase; letter-spacing: .07em; flex-shrink: 0; }
    .konu-text { font-size: 10.5px; font-weight: 700; color: #111; flex: 1; }
    .sinif-rozet { font-size: 9px; font-weight: 700; color: var(--sari); background: #1a1a1a; padding: 1px 7px; border-radius: 20px; flex-shrink: 0; }

    /* İÇERİK ALANI - 2 Sütunlu Grid */
    .sayfa-icerik {
      padding: 5mm 10mm;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9mm 14mm;
      align-content: start;
      outline: none;
    }
    .sayfa-icerik:focus { box-shadow: inset 0 0 0 2px rgba(245,197,24,.25); }

    /* Soru kutuları */
    .sayfa-icerik .soru,
    .sayfa-icerik .soru-kutusu,
    .sayfa-icerik .soru-kutusu-beyaz {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .sayfa-icerik img { max-width: 100%; height: auto; display: block; margin: 4px 0; border-radius: 4px; }
    .sayfa-icerik p, .sayfa-icerik div:not([class]) {
      font-size: 11px; line-height: 1.6; color: #1a1a1a;
    }

    /* SVG ve TABLO tam genişlik */
    .sayfa-icerik .tam-genislik,
    .sayfa-icerik [data-tam],
    .sayfa-icerik .svg-blok,
    .sayfa-icerik .tablo-blok {
      display: block !important;
      clear: both !important;
      float: none !important;
      width: 100% !important;
      grid-column: 1 / -1 !important;
    }
    .sayfa-icerik table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5px;
      margin: 6px 0;
    }
    .sayfa-icerik table th,
    .sayfa-icerik table td {
      border: 1px solid #d1d5db;
      padding: 4px 7px;
      text-align: left;
    }
    .sayfa-icerik table th {
      background: #f3f4f6;
      font-weight: 700;
    }
    .sayfa-icerik svg {
      display: block !important;
      max-width: 100%;
      height: auto;
    }

    /* Konu anlatım kutusu */
    .konu-anlatim {
      border-left: 4px solid var(--turuncu);
      background: #fff8e1;
      border-radius: 5px;
      padding: 10px 12px;
    }

    /* Boş durum */
    .bos-gosterge {
      grid-column: 1 / -1; text-align: center;
      padding: 18mm 0; color: #d1d5db;
      font-size: 11px; font-weight: 600;
      pointer-events: none; user-select: none;
    }
    .bos-gosterge svg { display: block; margin: 0 auto 10px; opacity: .4; }

    /* Sayfa numarasını işaretleyen etiket */
    .sayfa-no-etiket {
      position: absolute; top: -14px; right: 0;
      font-size: 10px; font-weight: 700; color: #6b7280;
    }

    /* FOOTER */
    .sayfa-footer { padding: 0 10mm 5mm; flex-shrink: 0; margin-top: auto; }
    .footer-serit { height: 4px; background: linear-gradient(90deg, var(--sari), #f0b800); border-radius: 2px; margin-bottom: 5px; }
    .footer-ic { display: flex; justify-content: space-between; align-items: center; }
    .footer-marka { font-size: 8.5px; font-weight: 700; color: #6b7280; }
    .footer-marka strong { color: #374151; }
    .footer-sayfa { font-size: 8.5px; font-weight: 600; color: #9ca3af; }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #111827; border: 1px solid #374151; color: #f9fafb;
      padding: 9px 15px; border-radius: 9px; font-size: 12px; font-weight: 600;
      z-index: 9999; box-shadow: 0 8px 24px rgba(0,0,0,.3);
      transition: opacity .3s, transform .3s;
    }
    .toast.hide { opacity: 0; transform: translateY(8px); }
    .toast.ok  { border-left: 3px solid #22c55e; }
    .toast.inf { border-left: 3px solid var(--sari); }
    .toast.err { border-left: 3px solid #ef4444; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }

    /* iPad uyumu */
    @media (max-width: 900px) {
      .left-panel { width: 260px; min-width: 220px; }
    }
    @media (max-width: 640px) {
      body { overflow: auto; height: auto; }
      .workspace { flex-direction: column; }
      .left-panel { width: 100%; min-width: unset; border-right: none; border-bottom: 1px solid var(--panel3); }
      .right-panel { padding: 12px 8px 30px; }
      .a4-sayfa { width: 100%; min-height: unset; }
    }
  </style>
</head>
<body>

<!-- ÜST BAR -->
<div class="top-bar">
  <img src="/logo.png" alt="Logo" onerror="this.style.display='none'" />
  <h1>Ders Notu Oluştur</h1>
  <span>— Fullematematiği Öğretmen Araçları</span>
  <div class="ai-badge" id="ai-badge">Yerel AI Hazır</div>
</div>

<div class="workspace">

  <!-- ══ SOL PANEL ══ -->
  <aside class="left-panel">

    <!-- Meta bilgiler -->
    <div class="fg">
      <p class="lbl">Konu / Başlık</p>
      <input id="inp-konu" type="text" placeholder="Ör: Üçgenler – 8. Sınıf" oninput="metaGuncelle()" />
    </div>

    <div class="row2">
      <div class="fg">
        <p class="lbl">Sınıf</p>
        <select id="inp-sinif" onchange="metaGuncelle()">
          <option value="">—</option>
          <option>5. Sınıf</option><option>6. Sınıf</option><option>7. Sınıf</option>
          <option>8. Sınıf</option><option>9. Sınıf</option><option>10. Sınıf</option>
          <option>11. Sınıf</option><option>12. Sınıf</option>
          <option>LGS</option><option>YKS</option><option>KPSS</option>
        </select>
      </div>
      <div class="fg">
        <p class="lbl">Tarih</p>
        <input id="inp-tarih" type="date" oninput="metaGuncelle()" />
      </div>
    </div>

    <div class="divider"></div>

    <!-- SEÇENEKLERİ: PDF veya Metin -->
    <div class="input-section-title">
      <span>Seçenek 1: PDF Dosyası Yükleyin</span>
      <span class="badge">PDF</span>
    </div>

    <div class="pdf-drop-zone" id="pdf-drop-zone"
         ondragover="event.preventDefault();this.classList.add('dragover')"
         ondragleave="this.classList.remove('dragover')"
         ondrop="pdfDustu(event)">
      <input type="file" id="pdf-yukle" accept=".pdf" onchange="pdfSecildi(event)" />
      <div class="drop-icon">📄</div>
      <div class="drop-text">PDF'i sürükle veya seç</div>
      <div class="drop-sub">Formüller ve tablo korunur</div>
    </div>
    <div id="pdf-dosya-adi"></div>

    <div class="divider"></div>

    <div class="input-section-title">
      <span>Seçenek 2: Düz Metin Yapıştırın</span>
      <span class="badge" style="background:#3b82f6;">TXT</span>
    </div>
    <textarea id="hoca-metin-girdisi"
      placeholder="Ders notlarınızı veya sorularınızı buraya yapıştırın...

Formüller $x^2 + 5x + 6 = 0$ şeklinde LaTeX desteklidir."></textarea>

    <div class="divider"></div>

    <!-- AI Durum Paneli -->
    <div class="ai-panel" id="ai-panel">
      <div id="ai-durum-yazisi">Başlatılıyor…</div>
      <div class="progress-bar-wrap">
        <div id="ai-progress-bar"></div>
      </div>
      <div class="ai-parca-info" id="ai-parca-info"></div>
    </div>

    <!-- Model bilgi -->
    <div class="model-info" id="model-info">
      🧠 Model: <strong id="model-adi">Tespit ediliyor…</strong>
    </div>

    <!-- ANA BAŞLAT BUTONU -->
    <button class="btn btn-ai" id="btn-baslat" onclick="fasikuluBaslat()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/>
      </svg>
      Fasikülü Hazırla (AI ile)
    </button>

    <!-- HIZLI RENDER (AI'SIZ) -->
    <button class="btn" id="btn-hizli" onclick="hizliGoster()" style="background:var(--panel2);border:1.5px solid var(--turuncu);color:var(--turuncu);font-size:11px;">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
      Hızlı Göster (AI'sız)
    </button>

    <div class="divider"></div>

    <!-- Fotoğraf ekle -->
    <input type="file" id="foto-input" accept="image/*" onchange="fotografYukle(event)" />
    <button class="btn btn-photo" onclick="document.getElementById('foto-input').click()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Seçili Yere Fotoğraf Ekle
    </button>

    <button class="btn btn-pdf" id="btn-pdf" onclick="pdfUret()">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      PDF Üret
    </button>

    <button class="btn btn-clear" onclick="temizle()">Alanı Temizle</button>

  </aside>

  <!-- ══ SAĞ PANEL ══ -->
  <section class="right-panel">
    <div class="preview-bar">
      <span>Canlı Önizleme</span>
      <span class="sayfa-badge" id="sayfa-badge">A4 • 1 Sayfa</span>
    </div>
    <div id="sayfalar-konteyner"></div>
  </section>

</div><!-- /workspace -->

<script type="module">
/* ═══════════════════════════════════════════════════════════
   MODÜL KAPSAMLI DEĞİŞKENLER
═══════════════════════════════════════════════════════════ */
let webllmEngine   = null;
let secilenModel   = '';
let nihaiEtiketliMetin = '';
let secilenPdfDosyasi  = null;

/* ═══════════════════════════════════════════════════════════
   CİHAZ TESPİTİ & MODEL SEÇİMİ
═══════════════════════════════════════════════════════════ */
function cihazModelSec() {
  const ua = navigator.userAgent || '';
  const isTabletOrMobile = /iPad|iPhone|iPod|Android|Mobile|Tablet/i.test(ua);
  const maxMemGB = navigator.deviceMemory || 4;
  const coreCount = navigator.hardwareConcurrency || 2;
  const isWeakDevice = isTabletOrMobile || maxMemGB <= 4 || coreCount <= 4;

  if (isWeakDevice) {
    return 'Qwen2.5-1.5B-Instruct-q4f16_1-MLC';   // iPad / hafif cihaz
  } else {
    return 'Llama-3.1-8B-Instruct-q4f32_1-MLC';    // Güçlü masaüstü
  }
}

/* ═══════════════════════════════════════════════════════════
   PDF.JS İLE PDF METİN OKUMA
═══════════════════════════════════════════════════════════ */
async function pdfdenMetinAl(dosya) {
  aiDurumYaz('PDF okunuyor…', 5);

  // pdf.js CDN'den yükle (ESM)
  let pdfjsLib;
  try {
    pdfjsLib = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
  } catch(e) {
    throw new Error('pdf.js yüklenemedi: ' + e.message);
  }

  const buffer  = await dosya.arrayBuffer();
  const pdfDoc  = await pdfjsLib.getDocument({ data: buffer }).promise;
  const toplamSayfa = pdfDoc.numPages;
  let hamMetin = '';

  for (let s = 1; s <= toplamSayfa; s++) {
    aiDurumYaz(`PDF sayfa ${s}/${toplamSayfa} okunuyor…`, 5 + Math.round((s / toplamSayfa) * 15));
    const sayfa   = await pdfDoc.getPage(s);
    const iceriği = await sayfa.getTextContent();
    const satirlar = iceriği.items.map(item => item.str).join(' ');
    hamMetin += satirlar + '\n';
  }

  return hamMetin.trim();
}

/* ═══════════════════════════════════════════════════════════
   AKILLI PARÇALAYICI
   – LaTeX ($...$), [TABLO]...[/TABLO], [SVG]...[/SVG]
     bloklarını ortadan bölmez.
   – Satır bazlı, 3000 karakter limiti
═══════════════════════════════════════════════════════════ */
function metniParcala(metin, limitChar = 3000) {
  const satirlar = metin.split('\n');
  const parcalar = [];
  let suankiParça = '';
  let tablodaMi   = false;
  let svgdeMi     = false;
  let latexSayac  = 0; // tek $ sayısı (çift → LaTeX blok)

  for (const satir of satirlar) {
    // Blok başlangıç/bitiş takibi
    if (satir.includes('[TABLO]'))  tablodaMi = true;
    if (satir.includes('[/TABLO]')) tablodaMi = false;
    if (satir.includes('[SVG]'))    svgdeMi   = true;
    if (satir.includes('[/SVG]'))   svgdeMi   = false;

    // Satırda tek $ sayısını say (LaTeX bütünlüğü)
    const dolarlar = (satir.match(/(?<!\$)\$(?!\$)/g) || []).length;
    latexSayac += dolarlar;
    const latexAcik = (latexSayac % 2 !== 0);

    const eklenecek = suankiParça ? suankiParça + '\n' + satir : satir;

    // Blok içinde veya LaTeX açıksa — zorla birleştir
    if (tablodaMi || svgdeMi || latexAcik) {
      suankiParça = eklenecek;
      continue;
    }

    // Limit aşıldıysa parçayı kapat
    if (eklenecek.length > limitChar && suankiParça.length > 0) {
      parcalar.push(suankiParça.trim());
      suankiParça   = satir;
      latexSayac    = dolarlar;
    } else {
      suankiParça   = eklenecek;
    }
  }

  if (suankiParça.trim()) parcalar.push(suankiParça.trim());
  return parcalar.filter(p => p.length > 0);
}

/* ═══════════════════════════════════════════════════════════
   WEBLLM MOTORU YÜKLE
═══════════════════════════════════════════════════════════ */
async function webllmYukle(modelAdi) {
  aiDurumYaz('Yerel AI modeli indiriliyor…', 20);
  document.getElementById('ai-badge').textContent = '⬇ Model İndiriliyor…';

  try {
    const { CreateMLCEngine } = await import(
      'https://esm.run/@mlc-ai/web-llm'
    );

    webllmEngine = await CreateMLCEngine(modelAdi, {
      initProgressCallback: (progress) => {
        const yuzdeTam = Math.round((progress.progress || 0) * 60) + 20; // 20→80
        const mesaj = progress.text || `İndiriliyor… ${Math.round((progress.progress || 0) * 100)}%`;
        aiDurumYaz(mesaj, Math.min(80, yuzdeTam));
      }
    });

    document.getElementById('ai-badge').textContent = '✓ Yerel AI Hazır';
    return true;
  } catch (e) {
    throw new Error('WebLLM yüklenemedi: ' + e.message);
  }
}

/* ═══════════════════════════════════════════════════════════
   TEK PARÇAYI AI'YA GÖNDER
═══════════════════════════════════════════════════════════ */
async function parcayiEtiketle(parcaMetni) {
  // Küçük modeller için kısa ve net talimat
  const sistemTalimati =
    'Aşağıdaki ders metnini kelimesi kelimesine koru, HİÇBİR İÇERİĞİ SİLME veya özetleme. ' +
    'Yalnızca şu etiketleri ekle: Bölüm başlıklarını "1. Başlık" biçimine sok, ' +
    'soru cümlelerinin önüne "SORU X:" yaz, ' +
    'çoktan seçmeli şıkları "A) B) C) D) E)" biçiminde tek satıra al (doğru şıkkın başına = ekle), ' +
    'matematik ifadelerini $...$ ile çevrelе. ' +
    'HTML, açıklama veya özet yazma. Sadece düzenlenmiş metni döndür.';

  let cikti = '';
  try {
    const yanit = await webllmEngine.chat.completions.create({
      messages: [
        { role: 'system', content: sistemTalimati },
        { role: 'user',   content: parcaMetni }
      ],
      temperature: 0.1,
      max_tokens: Math.min(2048, parcaMetni.length * 3),
    });
    cikti = yanit.choices?.[0]?.message?.content?.trim() || '';
  } catch(e) {
    console.warn('WebLLM parça hatası, orijinal kullanılıyor:', e);
    return parcaMetni;
  }

  // GÜVENLİK: Eğer çıktı girişin %40'ından kısaysa model içeriği yutmuştur → orijinali kullan
  if (cikti.length < parcaMetni.length * 0.4) {
    console.warn(`AI çıktısı çok kısa (${cikti.length}/${parcaMetni.length}), orijinal kullanılıyor.`);
    return parcaMetni;
  }

  return cikti;
}

/* ═══════════════════════════════════════════════════════════
   ANA GİRİŞ FONKSİYONU: fasikuluBaslat()
═══════════════════════════════════════════════════════════ */
async function fasikuluBaslat() {
  const btnBaslat  = document.getElementById('btn-baslat');
  const aiPanel    = document.getElementById('ai-panel');

  btnBaslat.disabled = true;
  aiPanel.classList.add('active');
  nihaiEtiketliMetin = '';

  try {
    /* ─── 1. Ham metin elde et ─── */
    let hamMetin = '';
    const pdfDosyasi = secilenPdfDosyasi;
    const textarea   = document.getElementById('hoca-metin-girdisi').value.trim();

    if (pdfDosyasi) {
      hamMetin = await pdfdenMetinAl(pdfDosyasi);
      toast(`PDF okundu: ${hamMetin.length} karakter`, 'ok');
    } else if (textarea) {
      hamMetin = textarea;
      aiDurumYaz('Metin alındı, parçalanıyor…', 10);
    } else {
      toast('Lütfen bir PDF yükleyin veya metin yapıştırın!', 'err');
      btnBaslat.disabled = false;
      aiPanel.classList.remove('active');
      return;
    }

    /* ─── 2. Parçala ─── */
    // Küçük modeller için parça boyutunu 900 karakterde tut
    const parcaBoyutu = secilenModel.includes('1.5B') || secilenModel.includes('2B') || secilenModel.includes('Tiny') ? 900 : 2000;
    const parcalar = metniParcala(hamMetin, parcaBoyutu);
    aiDurumYaz(`${parcalar.length} parçaya bölündü, AI hazırlanıyor…`, 15);
    document.getElementById('ai-parca-info').textContent =
      `Toplam ${parcalar.length} parça tespit edildi`;

    /* ─── 3. WebLLM model seç & yükle ─── */
    secilenModel = cihazModelSec();
    document.getElementById('model-adi').textContent = secilenModel;

    if (!webllmEngine) {
      await webllmYukle(secilenModel);
    } else {
      aiDurumYaz('AI motoru hazır, işleniyor…', 82);
    }

    /* ─── 4. Parçaları sırayla işle ─── */
    for (let i = 0; i < parcalar.length; i++) {
      const ilerleme = 82 + Math.round(((i + 1) / parcalar.length) * 15);
      aiDurumYaz(`Parça ${i + 1}/${parcalar.length} etiketleniyor…`, ilerleme);
      document.getElementById('ai-parca-info').textContent =
        `Parça ${i + 1} / ${parcalar.length} işleniyor`;

      const etiketli = await parcayiEtiketle(parcalar[i]);
      nihaiEtiketliMetin += (nihaiEtiketliMetin ? '\n\n' : '') + etiketli;
    }

    aiDurumYaz('✅ Etiketleme tamamlandı! Fasikül oluşturuluyor…', 98);

    /* ─── 5. Şablon motoruna gönder ─── */
    await fasikuluOlusturVeCiz(nihaiEtiketliMetin);

    aiDurumYaz('✅ Fasikül hazır!', 100);
    toast('Fasikül başarıyla oluşturuldu!', 'ok');

  } catch (err) {
    console.error('fasikuluBaslat hatası:', err);
    aiDurumYaz('❌ Hata: ' + err.message, 0);
    toast('Hata: ' + err.message, 'err');
  } finally {
    btnBaslat.disabled = false;
  }
}

/* ═══════════════════════════════════════════════════════════
   ETİKETLİ METİN → HTML DÖNÜŞTÜRÜCÜ & RENDERER
═══════════════════════════════════════════════════════════ */
function etiketliMetniHTML(metin) {
  const satirlar = metin.split('\n');
  let html = '';
  let soruSayaci = 0;
  let suankiSoruHTML = null; // aktif soru bloğu
  let i = 0;

  const soruKapat = () => {
    if (suankiSoruHTML !== null) {
      html += suankiSoruHTML + '</div>';
      suankiSoruHTML = null;
    }
  };

  while (i < satirlar.length) {
    let satir = satirlar[i].trim();

    /* Boş satır */
    if (!satir) { soruKapat(); i++; continue; }

    /* [TABLO] bloğu */
    if (satir.toUpperCase().includes('[TABLO]')) {
      soruKapat();
      let tabloIci = '';
      if (!satir.toUpperCase().includes('[/TABLO]')) {
        i++;
        while (i < satirlar.length && !satirlar[i].toUpperCase().includes('[/TABLO]')) {
          tabloIci += satirlar[i] + '\n'; i++;
        }
      } else {
        tabloIci = satir.replace(/\[TABLO\]/gi,'').replace(/\[\/TABLO\]/gi,'');
      }
      html += `<div class="tablo-blok tam-genislik" data-tam="1" style="display:block!important;clear:both!important;float:none!important;width:100%!important;grid-column:1/-1!important;margin:8px 0;"><table>${tabloIci}</table></div>`;
      i++; continue;
    }

    /* [SVG] bloğu */
    if (satir.toUpperCase().includes('[SVG]')) {
      soruKapat();
      let svgIci = '';
      if (!satir.toUpperCase().includes('[/SVG]')) {
        i++;
        while (i < satirlar.length && !satirlar[i].toUpperCase().includes('[/SVG]')) {
          svgIci += satirlar[i] + '\n'; i++;
        }
      } else {
        svgIci = satir.replace(/\[SVG\]/gi,'').replace(/\[\/SVG\]/gi,'');
      }
      html += `<div class="svg-blok tam-genislik" data-tam="1" style="display:block!important;clear:both!important;float:none!important;width:100%!important;grid-column:1/-1!important;margin:8px 0;text-align:center;">${svgIci}</div>`;
      i++; continue;
    }

    /* Başlık: "1. Başlık", "## Başlık", tamamı büyük harf kısa satır */
    const isBaslik =
      (/^\d+[.)\s]\s*\S/.test(satir) && satir.length < 100 && !/^\d+[.)\s]\s*[a-zçğışöşü]/.test(satir.substring(0,3))) ||
      /^#{1,3}\s/.test(satir) ||
      (satir === satir.toUpperCase() && satir.length > 3 && satir.length < 80 && /[A-ZÇĞİÖŞÜ]/.test(satir));

    if (isBaslik) {
      soruKapat();
      const baslikMetni = satir.replace(/^#{1,3}\s/, '');
      html += `<div class="konu-anlatim tam-genislik" data-tam="1" style="grid-column:1/-1!important;margin:10px 0 4px;"><h3 style="font-size:12.5px;font-weight:900;color:#1a1a1a;margin:0;">${baslikMetni}</h3></div>`;
      i++; continue;
    }

    /* SORU X: — satır başlıyor */
    if (/^SORU\s*\d+\s*:/i.test(satir)) {
      soruKapat();
      soruSayaci++;
      const soruMetni = satir.replace(/^SORU\s*\d+\s*:\s*/i, '');
      suankiSoruHTML = `<div class="soru-kutusu-beyaz" style="background:#fafafa;padding:10px;border-radius:5px;border:1px solid #e5e7eb;border-left:4px solid #2c3e50;break-inside:avoid;"><strong style="font-size:12px;color:#1a1a1a;">SORU ${soruSayaci}:</strong><p style="font-size:11.5px;line-height:1.55;margin:5px 0;">${soruMetni}</p><div style="font-size:11px;margin-top:4px;display:flex;flex-wrap:wrap;gap:4px;">`;
      i++; continue;
    }

    /* Şık satırı: A) B) C) D) E) – aktif soruya ekle veya yeni soru başlat */
    if (/^=?[A-E][.)]/i.test(satir)) {
      if (suankiSoruHTML !== null) {
        const isDogruSik = satir.startsWith('=');
        const temizSik   = satir.replace(/^=/, '');
        suankiSoruHTML  += isDogruSik
          ? `<span style="margin-right:8px;"><strong style="color:#e67e22;">${temizSik}</strong></span>`
          : `<span style="margin-right:8px;">${temizSik}</span>`;
      } else {
        // SORU bloğu dışında şık → tek paragraf olarak göster
        html += `<div style="font-size:11px;line-height:1.55;color:#374151;padding:2px 0;">${satir}</div>`;
      }
      i++; continue;
    }

    /* Aktif soru varsa ve şık değilse: soru gövdesine ekle */
    if (suankiSoruHTML !== null) {
      // Şık olmayan satır → soru metnine ekle, soruyu kapat
      soruKapat();
      // Sonra bu satırı normal paragraf olarak işle
      html += `<div style="font-size:11px;line-height:1.65;color:#374151;padding:3px 0;">${satir}</div>`;
      i++; continue;
    }

    /* ── GENEL PARAGRAF (AI etiketlememiş olsa bile tüm içerik görünsün) ── */
    html += `<div style="font-size:11px;line-height:1.65;color:#374151;padding:3px 0;">${satir}</div>`;
    i++;
  }

  // Açık soru varsa kapat
  soruKapat();
  return html;
}

/* ═══════════════════════════════════════════════════════════
   ANA ŞABLON MOTORU: fasikuluOlusturVeCiz()
═══════════════════════════════════════════════════════════ */
async function fasikuluOlusturVeCiz(etiketliMetin) {
  const icerikHTML = etiketliMetniHTML(etiketliMetin);

  // Explicit sayfa kesmelerinde böl
  const gruplar = splitAtBreaks(icerikHTML);
  const maxH    = await getMaxH();

  const tumSayfaIcerikleri = [];
  for (const grup of gruplar) {
    const subPages = await autoSplit(grup, maxH);
    for (const sp of subPages) {
      tumSayfaIcerikleri.push(sp.join(''));
    }
  }

  const konteyner = document.getElementById('sayfalar-konteyner');
  const toplam    = tumSayfaIcerikleri.length;
  konteyner.innerHTML = tumSayfaIcerikleri
    .map((ic, idx) => sayfaHTML(ic, idx + 1, toplam))
    .join('');

  document.getElementById('sayfa-badge').textContent =
    `A4 • 210mm • ${toplam} Sayfa`;

  // KaTeX render
  await new Promise(r => requestAnimationFrame(r));
  if (typeof renderMathInElement === 'function') {
    try {
      renderMathInElement(konteyner, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$',  right: '$',  display: false },
          { left: '\\(', right: '\\)', display: false },
          { left: '\\[', right: '\\]', display: true }
        ],
        throwOnError: false
      });
    } catch(e) {}
  }

  bindContentEditable();
}

/* ═══════════════════════════════════════════════════════════
   PDF.js OLAYLARI
═══════════════════════════════════════════════════════════ */
function pdfSecildi(e) {
  const dosya = e.target.files?.[0];
  if (!dosya) return;
  secilenPdfDosyasi = dosya;
  document.getElementById('pdf-dosya-adi').textContent = '✓ ' + dosya.name;
  document.getElementById('hoca-metin-girdisi').value = '';
  toast('PDF hazır: ' + dosya.name, 'ok');
}

function pdfDustu(e) {
  e.preventDefault();
  document.getElementById('pdf-drop-zone').classList.remove('dragover');
  const dosya = e.dataTransfer.files?.[0];
  if (!dosya || dosya.type !== 'application/pdf') {
    toast('Lütfen geçerli bir PDF dosyası bırakın.', 'err');
    return;
  }
  secilenPdfDosyasi = dosya;
  document.getElementById('pdf-dosya-adi').textContent = '✓ ' + dosya.name;
  document.getElementById('hoca-metin-girdisi').value = '';
  toast('PDF hazır: ' + dosya.name, 'ok');
}

      </div>
    </footer>
  </div>`;
}

function splitAtBreaks(htmlKod) {
  const temp = document.createElement('div');
  temp.innerHTML = htmlKod;
  const gruplar = [[]];
  for (const child of temp.children) {
    const s = (child.getAttribute('style') || '').replace(/\s/g, '');
    const isBreak = s.includes('page-break-after:always') || s.includes('break-after:always') || s.includes('break-after:page');
    if (isBreak) { gruplar.push([]); }
    else { gruplar[gruplar.length - 1].push(child.cloneNode(true)); }
  }
  return gruplar.filter(g => g.length > 0);
}

let cachedMaxH = null;
async function getMaxH() {
  if (cachedMaxH) return cachedMaxH;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;top:0;left:-99999px;visibility:hidden;pointer-events:none;';
  wrap.innerHTML = sayfaHTML('<div style="height:1px;opacity:0;"></div>', 1, 1);
  document.body.appendChild(wrap);
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const icerik = wrap.querySelector('.sayfa-icerik');
  const footer = wrap.querySelector('.sayfa-footer');
  const measured = footer.getBoundingClientRect().top - icerik.getBoundingClientRect().top - 12;
  document.body.removeChild(wrap);
  if (measured < 100) {
    const a4w = document.querySelector('.a4-sayfa')?.offsetWidth || 794;
    cachedMaxH = Math.round(220 * a4w / 210);
  } else {
    cachedMaxH = measured;
  }
  return cachedMaxH;
}

async function autoSplit(elements, maxHeightPx) {
  if (elements.length === 0) return [[]];
  if (elements.length === 1) return [[elements[0].outerHTML]];

  const a4w    = document.querySelector('.a4-sayfa')?.offsetWidth || 794;
  const pad    = Math.round(a4w * 10 / 210);
  const gapCol = Math.round(a4w * 14 / 210);
  const gapRow = Math.round(a4w *  9 / 210);

  const grid = document.createElement('div');
  grid.style.cssText = [
    'position:relative',
    `width:${a4w - pad * 2}px`,
    'display:grid',
    'grid-template-columns:1fr 1fr',
    `column-gap:${gapCol}px`,
    `row-gap:${gapRow}px`,
    'align-content:start',
    "font-family:'Lexend',sans-serif",
    'font-size:11px',
    'box-sizing:border-box'
  ].join(';');

  const offscreen = document.createElement('div');
  offscreen.style.cssText = 'position:fixed;top:0;left:-99999px;visibility:hidden;pointer-events:none;';
  offscreen.appendChild(grid);
  document.body.appendChild(offscreen);

  const klonlar = elements.map(el => {
    const k = el.cloneNode(true);
    grid.appendChild(k);
    return k;
  });

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  await new Promise(r => requestAnimationFrame(r));

  const sayfalar = [[]];
  let pageStart = 0;

  for (let i = 0; i < klonlar.length; i++) {
    const elTop = klonlar[i].offsetTop;
    if (sayfalar[sayfalar.length - 1].length > 0 &&
        (elTop - pageStart) >= maxHeightPx) {
      pageStart = elTop;
      sayfalar.push([]);
    }
    sayfalar[sayfalar.length - 1].push(elements[i].outerHTML);
  }

  document.body.removeChild(offscreen);
  return sayfalar;
}

function bindContentEditable() {
  document.querySelectorAll('.sayfa-icerik').forEach(el => {
    el.addEventListener('input', () => {
      nihaiEtiketliMetin = Array.from(document.querySelectorAll('.sayfa-icerik'))
        .map(e => e.innerText)
        .filter(h => !h.includes('PDF yükleyin veya metin yapıştırın'))
        .join('\n\n');
    });
  });
}

function metaGuncelle() {
  const { konu, sinif, tarih } = getMeta();
  document.querySelectorAll('.a4-sayfa').forEach(sayfa => {
    const km = sayfa.querySelector('.header-marka');
    if (!km) return;
    sayfa.querySelector('.konu-text').textContent = konu || '—';
    const mrows = sayfa.querySelectorAll('.meta-row');
    if (mrows[0]) mrows[0].innerHTML = `<strong>${sinif || '—'}</strong>`;
    if (mrows[1]) mrows[1].textContent = tarih;
    const rozet = sayfa.querySelector('.sinif-rozet');
    if (sinif) {
      if (rozet) { rozet.textContent = sinif; rozet.style.display = ''; }
      else {
        const kb = sayfa.querySelector('.konu-bar');
        if (kb) {
          const r = document.createElement('span');
          r.className = 'sinif-rozet';
          r.textContent = sinif;
          kb.appendChild(r);
        }
      }
    } else {
      if (rozet) rozet.style.display = 'none';
    }
  });
}

function fotografYukle(e) {
  const dosya = e.target.files[0];
  if (!dosya) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = document.createElement('img');
    img.src = ev.target.result;
    img.style.cssText = 'max-width:100%;height:auto;display:block;margin:5px 0;border-radius:4px;';
    const sel = window.getSelection();
    let eklendi = false;
    if (sel && sel.rangeCount > 0) {
      const range = sel.getRangeAt(0);
      for (const alan of document.querySelectorAll('.sayfa-icerik')) {
        if (alan.contains(range.commonAncestorContainer)) {
          range.deleteContents();
          range.insertNode(img);
          range.collapse(false);
          toast('Fotoğraf eklendi.', 'ok');
          eklendi = true;
          break;
        }
      }
    }
    if (!eklendi) {
      const alanlar = document.querySelectorAll('.sayfa-icerik');
      const son = alanlar[alanlar.length - 1];
      if (son) { son.appendChild(img); toast('Fotoğraf son sayfaya eklendi.', 'inf'); }
    }
  };
  reader.readAsDataURL(dosya);
  e.target.value = '';
}

/* ─── PDF ÜRETME ─── */
async function pdfUret() {
  const btn = document.getElementById('btn-pdf');
  btn.disabled = true;
  btn.textContent = 'Hazırlanıyor...';

  const sayfaListesi = Array.from(document.querySelectorAll('.a4-sayfa'));
  if (!sayfaListesi.length) {
    btn.disabled = false;
    btn.textContent = 'PDF Üret';
    return;
  }

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(17,24,39,.88);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Lexend,sans-serif;';
  overlay.innerHTML = `
    <div id="pdf-spinner" style="width:44px;height:44px;border:4px solid #F5C518;border-top-color:transparent;border-radius:50%;animation:_spin .8s linear infinite;"></div>
    <div id="pdf-durum" style="color:#fff;font-weight:700;font-size:14px;">Hazırlanıyor…</div>
    <style>@keyframes _spin{to{transform:rotate(360deg)}}</style>`;
  document.body.appendChild(overlay);
  const durum = overlay.querySelector('#pdf-durum');

  sayfaListesi.forEach(s => {
    s.dataset.os = s.style.boxShadow;
    s.dataset.or = s.style.borderRadius;
    s.style.boxShadow    = 'none';
    s.style.borderRadius = '0';
  });
  document.querySelectorAll('.sayfa-no-etiket').forEach(e => e.style.visibility = 'hidden');
  await new Promise(r => requestAnimationFrame(r));

  const dosyaAdi = (document.getElementById('inp-konu').value || 'ders-notu')
    .toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9\-]/g, '') || 'ders-notu';

  try {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });

    for (let i = 0; i < sayfaListesi.length; i++) {
      durum.textContent = `Sayfa ${i + 1} / ${sayfaListesi.length} işleniyor…`;

      const tmpWrap = document.createElement('div');
      tmpWrap.style.cssText = [
        'position:fixed','top:0','left:0',
        'width:210mm','background:#fff',
        'z-index:9997','pointer-events:none','overflow:visible'
      ].join(';');

      const klon = sayfaListesi[i].cloneNode(true);
      klon.style.boxShadow    = 'none';
      klon.style.borderRadius = '0';
      klon.querySelectorAll('.sayfa-no-etiket').forEach(el => el.remove());

      klon.querySelectorAll('svg').forEach(svg => {
        try {
          const w = parseInt(svg.getAttribute('width'))  || 160;
          const h = parseInt(svg.getAttribute('height')) || 110;
          let str = new XMLSerializer().serializeToString(svg);
          if (!str.includes('xmlns='))
            str = str.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg"');
          const sarici = document.createElement('div');
          sarici.style.cssText = 'text-align:center;margin:10px 0;line-height:0;';
          const img = document.createElement('img');
          img.src    = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
          img.width  = w;
          img.height = h;
          img.style.display = 'inline-block';
          sarici.appendChild(img);
          svg.parentNode.replaceChild(sarici, svg);
        } catch(e) {}
      });

      tmpWrap.appendChild(klon);
      document.body.appendChild(tmpWrap);
      await new Promise(r => setTimeout(r, 120));

      const klonH = klon.offsetHeight;
      const klonW = klon.offsetWidth;

      const canvas = await html2canvas(klon, {
        scale: 2, useCORS: true, allowTaint: false,
        logging: false, backgroundColor: '#ffffff',
        width: klonW, height: klonH
      });
      document.body.removeChild(tmpWrap);

      const imgData = canvas.toDataURL('image/jpeg', 0.95);
      const pdfW = 210;
      const pdfH = (canvas.height * pdfW) / canvas.width;

      if (i > 0) pdf.addPage([210, Math.max(297, pdfH)], 'portrait');
      pdf.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
    }

    pdf.save(`${dosyaAdi}.pdf`);
    toast('PDF indirildi!', 'ok');

  } catch (err) {
    console.error('PDF hatası:', err);
    toast('PDF hatası: ' + err.message, 'err');
  } finally {
    sayfaListesi.forEach(s => {
      s.style.boxShadow    = s.dataset.os || '';
      s.style.borderRadius = s.dataset.or || '';
    });
    document.querySelectorAll('.sayfa-no-etiket').forEach(e => e.style.visibility = '');
    document.body.removeChild(overlay);
    btn.disabled = false;
    btn.innerHTML = `
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      PDF Üret`;
  }
}

  document.getElementById('hoca-metin-girdisi').value = '';

  document.getElementById('sayfa-badge').textContent = 'A4 • 1 Sayfa';

}

function toast(msg, tip = 'inf') {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div');
  el.className = `toast ${tip}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 350); }, 2500);
}
