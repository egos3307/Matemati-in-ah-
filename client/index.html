    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Lexend', sans-serif !important;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
    </style>
    <!-- Prevent Google Translate from corrupting Material Symbols ligatures -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const addNoTranslate = (el) => {
          if (el.classList && el.classList.contains("material-symbols-outlined") && !el.classList.contains("notranslate")) {
            el.classList.add("notranslate");
            el.setAttribute("translate", "no");
          }
        };
        document.querySelectorAll(".material-symbols-outlined").forEach(addNoTranslate);
        const observer = new MutationObserver((mutations) => {
          for (const mutation of mutations) {
            for (const node of mutation.addedNodes) {
              if (node.nodeType === Node.ELEMENT_NODE) {
                if (node.classList && node.classList.contains("material-symbols-outlined")) {
                  addNoTranslate(node);
                }
                node.querySelectorAll(".material-symbols-outlined").forEach(addNoTranslate);
              }
            }
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>
    <!-- Jitsi Meet IFrame API -->
    <script src="/external_api.js"></script>
  </head>
  <body>
    <div id="root"></div>
